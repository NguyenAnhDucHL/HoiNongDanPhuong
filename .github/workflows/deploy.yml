name: Deploy to VNPT Server

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/hnd-backend:latest

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/hnd-frontend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Execute remote ssh commands to deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.VNPT_HOST }}
          username: ${{ secrets.VNPT_USER }}
          password: ${{ secrets.VNPT_PASS }}
          envs: GITHUB_TOKEN,GITHUB_ACTOR
          script: |
            set -e
            
            # Đảm bảo mã nguồn trên server đã có (chỉ cần lấy file cấu hình docker-compose, nginx, v.v)
            if [ ! -d "/root/HoiNongDanPhuong" ]; then
              cd /root
              git clone https://github.com/NguyenAnhDucHL/HoiNongDanPhuong.git
            fi
            
            cd /root/HoiNongDanPhuong || exit 1
            git fetch origin main
            git reset --hard origin/main

            echo ">>> Đăng nhập vào Github Container Registry trên VPS..."
            echo $GITHUB_TOKEN | docker login ghcr.io -u $GITHUB_ACTOR --password-stdin

            echo ">>> Pull image từ GHCR..."
            docker-compose pull backend
            docker-compose pull frontend

            echo ">>> Khởi động các container..."
            docker-compose up -d --no-build

            # Dọn dẹp image thừa
            docker image prune -f || true
