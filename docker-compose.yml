version: '3.8'

services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: hnd_backend
    ports:
      - "3002:3002"
    volumes:
      # Mount the data directory to persist the sqlite database
      - ./data:/app/data
      # Mount the uploads directory to persist uploaded images
      - ./data/uploads:/app/uploads
    env_file:
      - ./backend/.env
    environment:
      - DB_PATH=/app/data/database.sqlite
    restart: unless-stopped
    networks:
      - hnd_network

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hnd_frontend
    expose:
      - "80"
    environment:
      - VIRTUAL_HOST=hoinongdan.vpdtcampha.vn
      - VIRTUAL_PORT=80
      - LETSENCRYPT_HOST=hoinongdan.vpdtcampha.vn
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - hnd_network
      - proxy_network

networks:
  hnd_network:
    driver: bridge
  proxy_network:
    external: true
    name: tool-calendar_tool-calendar-net
